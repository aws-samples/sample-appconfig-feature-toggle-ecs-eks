AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ECS Fargate para o demo de feature toggle: cluster com Service Connect,
  ALB público para o frontend, backend interno, e o AppConfig Agent como
  sidecar em ambas as tasks.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets públicas (para ALB e tasks com IP público).
  BackendImage:
    Type: String
  FrontendImage:
    Type: String
  AppConfigAppId:
    Type: String
  AppConfigEnvId:
    Type: String
  AppConfigConfigId:
    Type: String
  AppConfigDeployStrategyId:
    Type: String
    Default: AppConfig.AllAtOnce
    Description: ID da deployment strategy usada pelo portal /admin (instantânea).
  TaskRoleArn:
    Type: String
    Description: Role usada pelas tasks (AppConfig + DynamoDB).
  ProductsTableName:
    Type: String
    Default: Products
  AwsRegion:
    Type: String
    Default: us-west-2
  CertificateArn:
    Type: String
    Description: ARN of the ACM certificate for HTTPS. Use 'none' to deploy with HTTP only (demo/dev).
    Default: none

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, "none"]]

Resources:
  # ---------- Cluster + namespace Service Connect ----------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: appconfig-demo
      ServiceConnectDefaults:
        Namespace: appconfig-demo.local

  # ---------- Log groups ----------
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/backend
      RetentionInDays: 7
  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/frontend
      RetentionInDays: 7

  # ---------- Execution role (pull de imagem + logs) ----------
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # ---------- Security groups ----------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - allows HTTPS 443 and HTTP 80 (redirect to HTTPS) from internet
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Allow HTTPS from internet
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Allow HTTP for HTTPS redirect

  FrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Tasks do frontend - recebe do ALB na porta 80
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Tasks do backend - recebe do frontend na porta 5000
      VpcId: !Ref VpcId

  BackendIngressFromFrontend:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref BackendSecurityGroup
      IpProtocol: tcp
      FromPort: 5000
      ToPort: 5000
      SourceSecurityGroupId: !Ref FrontendSecurityGroup

  # ---------- ALB ----------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 80
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"

  # HTTPS listener (used when CertificateArn is provided)
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  # HTTP listener - redirects to HTTPS when certificate is available,
  # otherwise forwards directly (dev/demo mode)
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref FrontendTargetGroup

  # ---------- Task definitions ----------
  BackendTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: backend
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !Ref TaskRoleArn
      ContainerDefinitions:
        - Name: backend
          Image: !Ref BackendImage
          Essential: true
          PortMappings:
            - Name: backend
              ContainerPort: 5000
              Protocol: tcp
          Environment:
            - { Name: APPCONFIG_APP_ID, Value: !Ref AppConfigAppId }
            - { Name: APPCONFIG_ENV_ID, Value: !Ref AppConfigEnvId }
            - { Name: APPCONFIG_CONFIG_ID, Value: !Ref AppConfigConfigId }
            - { Name: AWS_DEFAULT_REGION, Value: !Ref AwsRegion }
            - { Name: DYNAMODB_TABLE_NAME, Value: !Ref ProductsTableName }
          # Health check via Python (a imagem slim não traz curl): confirma que o
          # app Flask responde em /api/status antes de ECS considerar a task saudável.
          HealthCheck:
            Command:
              - CMD-SHELL
              - python -c "import urllib.request;urllib.request.urlopen('http://localhost:5000/api/status')" || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          DependsOn:
            - { ContainerName: appconfig-agent, Condition: START }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AwsRegion
              awslogs-stream-prefix: backend
        - Name: appconfig-agent
          Image: public.ecr.aws/aws-appconfig/aws-appconfig-agent:2.x
          Essential: true
          PortMappings:
            - ContainerPort: 2772
              Protocol: tcp
          Environment:
            - { Name: SERVICE_REGION, Value: !Ref AwsRegion }
            # Intervalo de polling do agent (default 45s). 30s acelera a propagação
            # de mudanças de flag — alinhado ao blog e aos task defs de ecs/.
            - { Name: POLL_INTERVAL, Value: "30" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AwsRegion
              awslogs-stream-prefix: appconfig-agent

  FrontendTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: frontend
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !Ref TaskRoleArn
      ContainerDefinitions:
        - Name: frontend
          Image: !Ref FrontendImage
          Essential: true
          PortMappings:
            - Name: frontend
              ContainerPort: 80
              Protocol: tcp
          Environment:
            - { Name: APPCONFIG_APP_ID, Value: !Ref AppConfigAppId }
            - { Name: APPCONFIG_ENV_ID, Value: !Ref AppConfigEnvId }
            - { Name: APPCONFIG_CONFIG_ID, Value: !Ref AppConfigConfigId }
            - { Name: AWS_DEFAULT_REGION, Value: !Ref AwsRegion }
            - { Name: APPCONFIG_DEPLOY_STRATEGY_ID, Value: !Ref AppConfigDeployStrategyId }
            # Resolvido via Service Connect (backend:5000 no namespace do cluster)
            - { Name: BACKEND_URL, Value: "http://backend:5000" }
          # Health check via Python (a imagem slim não traz curl): confirma que o
          # catálogo responde em / antes de ECS considerar a task saudável.
          HealthCheck:
            Command:
              - CMD-SHELL
              - python -c "import urllib.request;urllib.request.urlopen('http://localhost:80/')" || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          DependsOn:
            - { ContainerName: appconfig-agent, Condition: START }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FrontendLogGroup
              awslogs-region: !Ref AwsRegion
              awslogs-stream-prefix: frontend
        - Name: appconfig-agent
          Image: public.ecr.aws/aws-appconfig/aws-appconfig-agent:2.x
          Essential: true
          PortMappings:
            - ContainerPort: 2772
              Protocol: tcp
          Environment:
            - { Name: SERVICE_REGION, Value: !Ref AwsRegion }
            # Intervalo de polling do agent (default 45s). 30s acelera a propagação
            # de mudanças de flag — alinhado ao blog e aos task defs de ecs/.
            - { Name: POLL_INTERVAL, Value: "30" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FrontendLogGroup
              awslogs-region: !Ref AwsRegion
              awslogs-stream-prefix: appconfig-agent

  # ---------- Services ----------
  BackendService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref Cluster
      ServiceName: backend
      LaunchType: FARGATE
      DesiredCount: 2
      TaskDefinition: !Ref BackendTaskDef
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref BackendSecurityGroup]
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: appconfig-demo.local
        Services:
          - PortName: backend
            DiscoveryName: backend
            ClientAliases:
              - Port: 5000
                DnsName: backend

  FrontendService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      Cluster: !Ref Cluster
      ServiceName: frontend
      LaunchType: FARGATE
      DesiredCount: 2
      TaskDefinition: !Ref FrontendTaskDef
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref FrontendSecurityGroup]
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: 80
          TargetGroupArn: !Ref FrontendTargetGroup
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: appconfig-demo.local

Outputs:
  FrontendUrl:
    Description: URL pública do frontend
    Value: !If
      - HasCertificate
      - !Sub "https://${LoadBalancer.DNSName}"
      - !Sub "http://${LoadBalancer.DNSName}"
