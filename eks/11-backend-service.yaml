# Service interno do backend. O frontend acessa via http://backend-service.backend:5000
# (DNS do cluster). ClusterIP é suficiente — o backend não precisa ser exposto
# fora do cluster.
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: backend
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
