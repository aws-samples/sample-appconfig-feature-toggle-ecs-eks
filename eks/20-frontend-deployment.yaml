apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: backend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2772"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: appconfig-service-account
      terminationGracePeriodSeconds: 60
      containers:
      # --- Container da aplicação ---
      - name: frontend
        image: <ACCOUNT_ID>.dkr.ecr.us-west-2.amazonaws.com/frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: APPCONFIG_APP_ID
          value: "MyPythonApp"
        - name: APPCONFIG_ENV_ID
          value: "Demo"
        - name: APPCONFIG_CONFIG_ID
          value: "FeatureFlags"
        - name: AWS_DEFAULT_REGION
          value: "us-west-2"
        - name: BACKEND_URL
          value: "http://backend-service.backend:5000"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      # --- Sidecar do AppConfig Agent ---
      - name: appconfig-agent
        image: public.ecr.aws/aws-appconfig/aws-appconfig-agent:2.x
        ports:
        - name: http
          containerPort: 2772
          protocol: TCP
        env:
        - name: SERVICE_REGION
          value: us-west-2
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 2772
          initialDelaySeconds: 15
          periodSeconds: 20
