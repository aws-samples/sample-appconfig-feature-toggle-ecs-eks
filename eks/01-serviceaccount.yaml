# ServiceAccount usado por backend e frontend para autenticar no AWS AppConfig
# via IRSA (IAM Roles for Service Accounts).
#
# Substitua <ACCOUNT_ID> e o nome da role pelo output `AppConfigAgentRoleArn`
# da stack CloudFormation (ver iac/template.yaml). A role precisa da permissão
# ssm:GetLatestConfiguration + ssm:StartConfigurationSession e uma trust policy
# para o OIDC provider do seu cluster EKS.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: appconfig-service-account
  namespace: backend
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/appconfig-feature-toggle-AppConfigAgentRole
